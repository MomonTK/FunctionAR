<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets>
        <video id="my-video" src="video.mp4" autoplay loop muted playsinline webkit-playsinline></video>
      </a-assets>

      <a-marker type="pattern" url="pattern-hiro.patt">
        
        <a-video src="#my-video" position="0 0.5 0" rotation="-90 0 0" width="4" height="2.25"></a-video>
      
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>

  </body>
</html>
