<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-marker type="pattern" url="pattern-hiro.patt">
        
        <a-image id="dashboard" src="capture.jpg" position="0 0.5 0" rotation="-90 0 0" width="4" height="2.25"></a-image>
      
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      setInterval(() => {
        const imgElement = document.querySelector('#dashboard');
        // Thêm chuỗi thời gian vào đuôi ảnh để trình duyệt bắt buộc phải tải lại ảnh mới (không xài cache)
        imgElement.setAttribute('src', 'capture.jpg?' + new Date().getTime());
      }, 5000); 
    </script>
  </body>
</html>
