<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <script>
      AFRAME.registerComponent('video-handler', {
        init: function () {
          let marker = this.el;
          let video = document.querySelector("#my-video");

          // Khi camera quét thấy hình (marker) -> tự động Play video
          marker.addEventListener('markerFound', function () {
            video.play();
          });

          // Khi camera lướt đi chỗ khác (mất marker) -> Tạm dừng Pause video để đỡ nặng máy
          marker.addEventListener('markerLost', function () {
            video.pause();
          });
        }
      });

      // Lớp bảo mật chống "đóng băng" cho iPhone/Safari: 
      // Ép trình duyệt cấp quyền chạy video ngay khi người dùng chạm nhẹ vào màn hình 1 lần
      window.addEventListener('click', function () {
        let v = document.querySelector('#my-video');
        v.play();
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets>
        <video id="my-video" crossorigin="anonymous" src="video.mp4" autoplay loop muted playsinline webkit-playsinline></video>
      </a-assets>

      <a-marker type="pattern" url="pattern-hiro.patt" video-handler>
        <a-video src="#my-video" position="0 0.5 0" rotation="-90 0 0" width="4" height="2.25"></a-video>
      </a-marker>
      
      <a-entity camera></a-entity>
    </a-scene>

  </body>
</html>
