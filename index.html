<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <script>
      // ĐOẠN SCRIPT THÔNG MINH: Tự động tìm đúng video nằm ĐẰNG TRONG marker đang quét
      AFRAME.registerComponent('video-handler', {
        init: function () {
          let marker = this.el;
          // Tìm thẻ <a-video> nằm bên trong marker này
          let aVideo = marker.querySelector("a-video");
          // Lấy ra id của video gốc (ví dụ: #video1 hoặc #video2)
          let videoSrc = aVideo.getAttribute("src");
          let videoNode = document.querySelector(videoSrc);

          // Khi camera quét thấy marker này -> tự động Play video tương ứng
          marker.addEventListener('markerFound', function () {
            videoNode.play();
          });

          // Khi camera lướt đi chỗ khác -> Tạm dừng video của máy này
          marker.addEventListener('markerLost', function () {
            videoNode.pause();
          });
        }
      });

      // Lớp bảo mật kích hoạt âm thầm cho cả 2 video khi người dùng chạm màn hình lần đầu
      window.addEventListener('click', function () {
        document.querySelectorAll('video').forEach(v => v.play());
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets>
        <video id="video1" crossorigin="anonymous" src="video.mp4" autoplay loop muted playsinline webkit-playsinline></video>
        <video id="video2" crossorigin="anonymous" src="video2.mp4" autoplay loop muted playsinline webkit-playsinline></video>
      </a-assets>

      <a-marker type="pattern" url="pattern-so1.patt" video-handler>
        <a-video src="#video1" position="0 0.5 0" rotation="-90 0 0" width="4" height="2.25"></a-video>
        <a-image src="capture.jpg" position="2.5 0.5 0" rotation="-90 0 0" width="2" height="2"></a-image>
      </a-marker>

      <a-marker type="pattern" url="pattern-hiro.patt" video-handler>
        <a-video src="#video2" position="0 0.5 0" rotation="-90 0 0" width="4" height="2.25"></a-video>
        <a-image src="capture.jpg" position="2.5 0.5 0" rotation="-90 0 0" width="2" height="2"></a-image>
      </a-marker>
      
      <a-entity camera></a-entity>
    </a-scene>

  </body>
</html>
